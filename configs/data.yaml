{
  "data": {
    "runtime": {
      "mode": "fixture",
      "local_jsonl_path": null,
      "hf": {
        "streaming": false,
        "max_rows_per_dataset": null,
        "dataset_download_workers": 2
      }
    },
    "datasets": [
      {"name": "alwaysgood/reuter_processed", "split": "train"},
      {"name": "alwaysgood/c4_noblocklist_processed", "split": "train"},
      {"name": "alwaysgood/Bloomberg_Financial_News_processed", "split": "train"},
      {"name": "alwaysgood/earnings_call_mono", "split": "train"},
      {
        "name": "alwaysgood/sec-10k-pre-processed",
        "split": "train",
        "data_files": {"train": "translation_dataset.parquet"}
      }
    ],
    "text_columns": ["source_text", "text"],
    "subset_size": null,
    "split": {
      "eval_ratio": 0.02,
      "seed": 42
    },
    "sampling": {
      "strategy": "first_n",
      "seed": 42
    },
    "length": {
      "enabled": true,
      "mode": "tokenizer",
      "max_total_tokens": 8192,
      "max_source_tokens": 4000,
      "max_output_tokens": 4096,
      "prompt_template_tokens": 256,
      "min_available_output_tokens": 768,
      "safety_margin_tokens": 64,
      "overflow": "split",
      "output_budget_strategy": "dynamic",
      "tokenizer_name": null,
      "tokenizer_fallback": "whitespace",
      "tokenizer_local_files_only": false,
      "tokenizer_batch_size": 512,
      "split": {
        "unit": "sentence",
        "max_source_tokens_per_chunk": 4000,
        "max_chunks_per_row": 4,
        "min_chunk_tokens": 32,
        "fallback_for_long_sentence": "skip",
        "on_max_chunks_exceeded": "skip"
      }
    },
    "ood_test": {
      "enabled": true,
      "path": "data/test.csv",
      "source_column": "Source_En",
      "target_column": "Target_Ko"
    },
    "num_workers": 4
  }
}
