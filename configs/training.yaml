{
  "training": {
    "backend": "unsloth",
    "runtime": {
      "mode": "mock",
      "subprocess": {
        "collapse_command": null,
        "unload_command": null,
        "update_command": null
      }
    },
    "collapse_lora": {
      "rank": 4,
      "learning_rate": 0.005,
      "num_train_epochs": 1,
      "dropout": 0.0,
      "bias": "none"
