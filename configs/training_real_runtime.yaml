{
  "training": {
    "runtime": {
      "mode": "subprocess",
      "subprocess": {
        "collapse_command": [
          "torchrun",
          "--nproc_per_node=4",
          "-m",
          "scp_stage4.pipeline.workers.training_worker"
        ],
        "unload_command": [
          "torchrun",
          "--nproc_per_node=1",
          "-m",
          "scp_stage4.pipeline.workers.training_worker"
        ],
        "update_command": [
          "torchrun",
          "--nproc_per_node=4",
          "-m",
          "scp_stage4.pipeline.workers.training_worker"
        ]
      }
    }
  }
}
